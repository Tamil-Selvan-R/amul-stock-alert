name: Check Amul stock

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send test message"
        type: boolean
        default: false
      debug:
        description: "Save a copy of the page to the debug folder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    # Pinned: Playwright's installer may not support the newest Ubuntu yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install browser
        if: ${{ !inputs.test_message }}
        # If this fails, the plain check still runs.
        continue-on-error: true
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check stock
        env:
          PINCODE: ${{ secrets.PINCODE }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message && '1' || '0' }}
          JITTER_SECONDS: ${{ inputs.debug && '0' || '45' }}
          DEBUG_DIR: ${{ inputs.debug && 'debug' || '' }}
        run: python check_stock.py

      - name: Save state if it changed
        run: |
          if [ -n "$(git status --porcelain state.json debug)" ]; then
            git config user.name "stock-bot"
            git config user.email "stock-bot@users.noreply.github.com"
            git add state.json
            if [ -d debug ]; then git add debug; fi
            git commit -m "Update stock state"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
